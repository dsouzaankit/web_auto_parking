# Cloud build for PM Parking (no local Mac).
# Configure code signing in Codemagic UI: Team, bundle id com.webautoparking.app

workflows:
  ios-release:
    name: PM Parking iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.webautoparking.app
      vars:
        XCODE_SCHEME: ParkMobileParking
    scripts:
      - name: Generate Xcode project
        script: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/ios/ParkMobileParking.xcodeproj" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
