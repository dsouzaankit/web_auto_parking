# Builds iOS on GitHub-hosted macOS (no local Mac).
# - push / PR: simulator smoke build (no secrets)
# - workflow_dispatch: device IPA artifact (unsigned, or signed if Apple ID secrets set)

name: ios-build

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-simulator:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode (latest on macOS 26 runner)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Use BookingConfig template for CI
        working-directory: ios
        run: |
          cp WebAutoParking/Resources/BookingConfig.example.json \
             WebAutoParking/Resources/BookingConfig.json

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Build (simulator, unsigned smoke test)
        working-directory: ios
        run: |
          xcodebuild -project WebAutoParking.xcodeproj \
            -scheme WebAutoParking \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            build CODE_SIGNING_ALLOWED=NO

  build-ipa:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode (latest on macOS 26 runner)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Use BookingConfig template for CI
        working-directory: ios
        run: |
          cp WebAutoParking/Resources/BookingConfig.example.json \
             WebAutoParking/Resources/BookingConfig.json

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Build device IPA
        working-directory: ios
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          package_unsigned_ipa() {
            APP_PATH="$(find build/DerivedData -name 'WebAutoParking.app' -type d | head -1)"
            if [[ -z "$APP_PATH" ]]; then
              echo "WebAutoParking.app not found under build/DerivedData"
              find build/DerivedData -maxdepth 6 -type d -name '*.app' || true
              exit 1
            fi
            codesign --force --sign - --timestamp=none --deep "$APP_PATH"
            rm -rf Payload WebAutoParking.ipa
            mkdir -p Payload
            cp -R "$APP_PATH" Payload/
            zip -yr WebAutoParking.ipa Payload
            rm -rf Payload
          }

          verify_ipa_bundle_id() {
            local plist_path appicon_car icon_name icon_files
            rm -rf ipa-verify
            unzip -q WebAutoParking.ipa -d ipa-verify
            plist_path="$(find ipa-verify -path '*/WebAutoParking.app/Info.plist' | head -1)"
            BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist_path")"
            echo "CFBundleIdentifier=$BUNDLE_ID"
            if [[ -z "$BUNDLE_ID" || "$BUNDLE_ID" == *'$'* ]]; then
              echo "ERROR: Missing CFBundleIdentifier in IPA."
              exit 1
            fi
            appicon_car="$(find ipa-verify -path '*/WebAutoParking.app/Assets.car' -print | head -1)"
            if [[ -z "$appicon_car" ]]; then
              echo "ERROR: Assets.car missing from IPA (AppIcon will be blank)"
              exit 1
            fi
            echo "OK: Assets.car in IPA at $appicon_car"
            icon_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$plist_path" 2>/dev/null || true)"
            if [[ -z "$icon_name" ]]; then
              icon_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$plist_path" 2>/dev/null || true)"
            fi
            echo "CFBundleIconName=${icon_name:-<missing>}"
            if [[ "$icon_name" != "AppIcon" ]]; then
              echo "ERROR: CFBundleIconName must be AppIcon (got '${icon_name:-empty}')"
              exit 1
            fi
            icon_files="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:0' "$plist_path" 2>/dev/null || true)"
            echo "CFBundleIconFiles[0]=${icon_files:-<missing>}"
            if [[ -z "$icon_files" ]]; then
              echo "ERROR: CFBundleIconFiles missing (Control Center Open App needs loose AppIcon60x60)"
              exit 1
            fi
            if ! find ipa-verify -path '*/WebAutoParking.app/AppIcon60x60@2x.png' | grep -q .; then
              echo "ERROR: AppIcon60x60@2x.png missing from IPA"
              exit 1
            fi
            if ! find ipa-verify -path '*/WebAutoParking.app/PlugIns/ParkingControls.appex' -type d | grep -q .; then
              echo "ERROR: ParkingControls.appex missing (Control Center Open Parking control)"
              find ipa-verify -path '*/PlugIns/*' -maxdepth 5 2>/dev/null || true
              exit 1
            fi
            echo "OK: ParkingControls.appex embedded"
            rm -rf ipa-verify
          }

          if [[ -n "${APPLE_ID:-}" ]]; then
            if [[ -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" || -z "${APPLE_TEAM_ID:-}" ]]; then
              echo "APPLE_ID is set; also set APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID,"
              echo "or remove APPLE_ID to build an unsigned IPA for AltStore."
              exit 1
            fi

            ARCHIVE_PATH="$RUNNER_TEMP/WebAutoParking.xcarchive"
            EXPORT_PATH="$RUNNER_TEMP/ipa-export"

            xcodebuild -project WebAutoParking.xcodeproj \
              -scheme WebAutoParking \
              -destination 'generic/platform=iOS' \
              -configuration Release \
              -archivePath "$ARCHIVE_PATH" \
              archive \
              -allowProvisioningUpdates \
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID"

            /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" ExportOptions-development.plist 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Set :teamID $APPLE_TEAM_ID" ExportOptions-development.plist

            xcodebuild -exportArchive \
              -archivePath "$ARCHIVE_PATH" \
              -exportPath "$EXPORT_PATH" \
              -exportOptionsPlist ExportOptions-development.plist \
              -allowProvisioningUpdates

            cp "$EXPORT_PATH"/*.ipa WebAutoParking.ipa
            verify_ipa_bundle_id
          else
            echo "No APPLE_ID secret — building unsigned IPA (re-sign in AltStore)."
            xcodebuild -project WebAutoParking.xcodeproj \
              -scheme WebAutoParking \
              -destination 'generic/platform=iOS' \
              -configuration Release \
              -derivedDataPath build/DerivedData \
              build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY=- \
              DEVELOPMENT_TEAM=

            package_unsigned_ipa
            verify_ipa_bundle_id
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v5
        with:
          name: WebAutoParking-ipa
          path: ios/WebAutoParking.ipa
          if-no-files-found: error
