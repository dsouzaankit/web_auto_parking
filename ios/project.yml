# XcodeGen spec — run: xcodegen generate (from ios/)
name: WebAutoParking
options:
  bundleIdPrefix: com.webautoparking
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  WebAutoParking:
    type: application
    platform: iOS
    sources:
      - path: WebAutoParking
        excludes:
          - Resources
      - path: WebAutoParking/Assets.xcassets
        buildPhase: resources
      - path: WebAutoParking/Resources/BookingConfig.json
        buildPhase: resources
        type: file
    info:
      path: WebAutoParking/Resources/Info.plist
      properties:
        CFBundleDisplayName: Parking
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.webautoparking.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
