# XcodeGen spec — run: xcodegen generate (from ios/)
name: WebAutoParking
options:
  bundleIdPrefix: com.webautoparking
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  WebAutoParking:
    type: application
    platform: iOS
    sources:
      - path: WebAutoParking
        excludes:
          - Resources
      - path: WebAutoParking/Assets.xcassets
        buildPhase: resources
      - path: WebAutoParking/Resources/BookingConfig.json
        buildPhase: resources
        type: file
    settings:
      base:
        # Merge generated launch screen / scene keys with Privacy Info.plist (same as Loop Segments).
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: WebAutoParking/Resources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Parking
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        PRODUCT_BUNDLE_IDENTIFIER: com.webautoparking.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "46"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
