# XcodeGen spec — run: xcodegen generate (from ios/)
name: WebAutoParking
options:
  bundleIdPrefix: com.webautoparking
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  WebAutoParking:
    type: application
    platform: iOS
    sources:
      # Assets.xcassets lives under WebAutoParking/ (not Resources/) — same as Loop Segments.
      # Do not also list it as buildPhase: resources (that broke Control Center icon resolution).
      - path: WebAutoParking
        excludes:
          - Resources
      - path: WebAutoParking/Resources/BookingConfig.json
        buildPhase: resources
        type: file
    settings:
      base:
        # Merge generated launch screen / scene keys with Privacy Info.plist (same as Loop Segments).
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: WebAutoParking/Resources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Parking
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        PRODUCT_BUNDLE_IDENTIFIER: com.webautoparking.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "62"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
