# XcodeGen spec — run: xcodegen generate (from ios/)
name: ParkMobileParking
options:
  bundleIdPrefix: com.webautoparking
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  ParkMobileParking:
    type: application
    platform: iOS
    sources:
      - path: ParkMobileParking
        excludes:
          - Resources
      - path: ParkMobileParking/Assets.xcassets
        buildPhase: resources
      - path: ParkMobileParking/Resources/BookingConfig.json
        buildPhase: resources
        type: file    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Parking
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        PRODUCT_BUNDLE_IDENTIFIER: com.webautoparking.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
